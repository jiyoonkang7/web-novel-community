<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>덧글</title>

    <!-- 브라우저 탭 아이콘 -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

  <div class="phone">

    <!-- status-bar UI -->
    <img class="status-bar" src="assets/status-bar.png" alt="상태바">

    <!-- 가운데 로고 -->
    <img class="logo" src="assets/logo.png" alt="로고">

    <!-- 서비스명 -->
    <img class="logo-name" src="assets/logo-name.png" alt="덧글">

    <!-- 슬로건 -->
    <p class="slogan">스토리를, 함께 나누다</p>

    <!-- 카카오톡으로 시작하기 -->
    <button class="btn btn-kakao" id="kakaoBtn">
      <img class="btn-icon icon-kakao" src="assets/icon-kakao.png" alt="카카오톡 아이콘">
      <span class="btn-text">카카오톡으로 시작하기</span>
    </button>

    <!-- Apple로 시작하기 -->
    <button class="btn btn-apple" id="appleBtn">
      <img class="btn-icon icon-apple" src="assets/icon-apple.png" alt="Apple 아이콘">
      <span class="btn-text">Apple로 시작하기</span>
    </button>

    <!-- 하단 링크 -->
    <p class="bottom-links">다른 방법으로 로그인  |  계정 찾기</p>

  </div>

<script src="js/login.js"></script>
</body>
</html>
