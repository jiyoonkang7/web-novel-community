<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>덧글</title>
    <meta property="og:description" content="스토리를, 함께 나누다">
    <meta property="og:image" content="assets/preview.png">

    <!-- 브라우저 탭 아이콘 -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="css/bookmark.css">

</head>

<body>

  <div class="phone">

    <!-- status-bar (고정) -->
    <img class="status-bar" src="assets/status-bar.png" alt="상태바">

    <!-- header (고정) -->
    <header class="header">
      <h1 class="board-title cap-trim">북마크</h1>
    </header>

    <!-- 북마크한 게시글 목록 (스크롤) - js/bookmark.js가 그린다.
         게시판을 가리지 않고 북마크한 글만 최근에 북마크한 순서로 보여준다. -->
    <main class="content" id="postList"></main>

    <!-- 하단 그라데이션 (고정) -->
    <div class="bottom-fade"></div>

    <!-- 내비게이터 (고정) - home과 같은 모양이고 지금 화면인 북마크가 켜져 있다 -->
    <nav class="navigator">
      <!-- 색이 바뀌어야 해서 이미지 대신 인라인 SVG (stroke="currentColor") -->
      <button class="nav-item is-active" data-nav="bookmark" aria-label="북마크">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M23 6H8V24.5L15.5 21.5L23 24.5V6Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="nav-item" data-nav="home" aria-label="홈">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M15.5 5L6 12V26H12.5V18H18.5V26H25V12L15.5 5Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="nav-item" data-nav="my" aria-label="마이">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M11 9C11 6.5 12.5 5 15 5C17.5 5 19 6.5 19 9C19 11.5 17.5 13 15 13C12.5 13 11 11.5 11 9Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6 24C6 24 7 17 15 17C23 17 24 24 24 24"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>

  </div>

<script src="js/data.js"></script>
<script src="js/bookmark.js"></script>
</body>
</html>
