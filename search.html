<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>덧글</title>

    <!-- 브라우저 탭 아이콘 -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="css/search.css">

</head>

<body>

  <div class="phone">

    <!-- status-bar (고정) -->
    <img class="status-bar" src="assets/status-bar.png" alt="상태바">

    <!-- header (고정) - 뒤로 가기를 누르면 home으로 돌아간다 -->
    <header class="header">
      <button class="back-button" id="backBtn" type="button" aria-label="뒤로 가기">
        <img class="icon-back" src="assets/icon-back.svg" alt="">
      </button>

      <!-- 작품명 또는 작가명으로 찾는다 (돋보기를 누르거나 엔터를 치면 찾는다) -->
      <div class="search-bar">
        <input class="search-input" id="searchInput" type="text"
               placeholder="관심있는 작품을 검색하세요!" autocomplete="off">
        <button class="search-button" id="searchBtn" type="button" aria-label="검색">
          <img class="icon-search" src="assets/icon-search.svg" alt="">
        </button>
      </div>
    </header>

    <!-- 장르별 검색 (고정) - 해시태그는 js/search.js가 GENRES로 그린다 -->
    <section class="genre-section">
      <h2 class="genre-title cap-trim">장르별 검색</h2>
      <div class="genre-strip" id="genreStrip">
        <div class="genre-list" id="genreList"></div>
      </div>
    </section>

    <!-- 작품 목록 (스크롤) - js/search.js가 WORKS로 그린다 -->
    <main class="content" id="workGrid"></main>

    <!-- 작품 추가 카드가 열렸을 때 깔리는 막 -->
    <div class="dim" id="dim" hidden></div>

    <!-- 내 게시판에 없는 작품의 표지를 누르면 뜨는 카드 -->
    <div class="add-card" id="addCard" role="dialog" aria-modal="true" hidden>
      <p class="add-title" id="addTitle"></p>
      <p class="add-desc cap-trim">내 게시판에 추가하시겠습니까?</p>
      <button class="add-cancel cap-trim" id="addCancel" type="button">취소</button>
      <button class="add-confirm cap-trim" id="addConfirm" type="button">예</button>
    </div>

  </div>

<script src="js/data.js"></script>
<script src="js/search.js"></script>
</body>
</html>
