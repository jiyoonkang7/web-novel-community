<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>덧글</title>

    <!-- 브라우저 탭 아이콘 -->
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="css/my.css">

</head>

<body>

  <div class="phone">

    <!-- status-bar (고정) -->
    <img class="status-bar" src="assets/status-bar.png" alt="상태바">

    <!-- header (고정) -->
    <header class="header">
      <h1 class="board-title cap-trim">내 설정</h1>
    </header>

    <main class="content">

      <!-- 프로필 사진 - 누르면 파일 탐색기가 열리고, 고른 사진이 이 자리에 들어간다.
           마우스를 올리면 위에 막이 덮이면서 카메라 아이콘이 보인다. -->
      <button class="profile" id="profileBtn" type="button" aria-label="프로필 사진 바꾸기">
        <img class="profile-image" id="profileImage" src="assets/profile.jpg" alt="프로필 사진">
        <span class="profile-hover">
          <img class="icon-camera" src="assets/icon-camera.svg" alt="">
        </span>
      </button>

      <!-- 고른 사진은 이 입력으로 받는다 (화면에는 보이지 않는다) -->
      <input class="photo-input" id="photoInput" type="file" accept="image/*" hidden>

      <!-- 닉네임 - 연필을 누르면 이름 수정 카드가 뜬다 -->
      <div class="name-row">
        <p class="user-name cap-trim" id="userName">june</p>
        <button class="name-edit" id="nameEditBtn" type="button" aria-label="이름 바꾸기">
          <img class="icon-pencil" src="assets/icon-pencil.svg" alt="">
        </button>
      </div>

      <!-- 누르면 내가 쓴 게시글 목록(my_post)으로 간다. 개수는 js/my.js가 채운다 -->
      <button class="post-bar" id="postBar" type="button">
        <span class="post-bar-label cap-trim">내가 작성한 게시글</span>
        <span class="post-bar-count cap-trim" id="postCount">0개</span>
      </button>

    </main>

    <!-- 내비게이터 (고정) - home과 같은 모양이고 지금 화면인 마이가 켜져 있다 -->
    <nav class="navigator">
      <!-- 색이 바뀌어야 해서 이미지 대신 인라인 SVG (stroke="currentColor") -->
      <button class="nav-item" data-nav="bookmark" aria-label="북마크">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M23 6H8V24.5L15.5 21.5L23 24.5V6Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="nav-item" data-nav="home" aria-label="홈">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M15.5 5L6 12V26H12.5V18H18.5V26H25V12L15.5 5Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="nav-item is-active" data-nav="my" aria-label="마이">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M11 9C11 6.5 12.5 5 15 5C17.5 5 19 6.5 19 9C19 11.5 17.5 13 15 13C12.5 13 11 11.5 11 9Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6 24C6 24 7 17 15 17C23 17 24 24 24 24"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>

    <!-- 이름 수정 카드가 열렸을 때 깔리는 막 -->
    <div class="dim" id="dim" hidden></div>

    <!-- 연필을 누르면 뜨는 이름 수정 카드 (다른 화면의 카드와 같은 모양) -->
    <div class="name-card" id="nameCard" role="dialog" aria-modal="true" hidden>
      <input class="name-input" id="nameInput" type="text"
             maxlength="12" autocomplete="off" aria-label="바꿀 이름">
      <button class="name-cancel cap-trim" id="nameCancel" type="button">취소</button>
      <button class="name-confirm cap-trim" id="nameConfirm" type="button">수정</button>
    </div>

  </div>

<script src="js/data.js"></script>
<script src="js/my.js"></script>
</body>
</html>
